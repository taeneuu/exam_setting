  if(a === "ttCancel"){ ttConfirm = null; return render(); }
  if(a === "newExamGo"){
    pushUndo("tt","새 시험 시작");
    const kept = archiveCurrent();
    state.days = []; state.examTitle = ""; state.rangeStart = ""; state.rangeEnd = ""; genMsg = ""; genPreview = null; ttConfirm = null;
    flash(kept ? "새 시험을 시작했어요. 지난 시간표는 ‘보관한 시험’에 있어요." : "새 시험을 시작했어요.");
    return commit();
  }
  if(a === "toggleArchive"){ showArchive = !showArchive; return render(); }
  if(a === "copyArch"){ ttConfirm = {kind:"copy", id:b.dataset.id, dates:"keep"}; render(); const c = document.getElementById("ttConfirm"); if(c) c.scrollIntoView({block:"nearest"}); return; }
  if(a === "copyGo"){
    const src = ttConfirm && state.archive.find(x => x.id === ttConfirm.id); if(!src) return;
    pushUndo("tt", `‘${src.examTitle || "보관한 시험"}’ 가져오기`);
    const clear = ttConfirm.dates === "clear";
    const days = cloneDays(src.days); if(clear) days.forEach(d => d.date = "");
    archiveCurrent();
    state.days = days; state.examTitle = src.examTitle || ""; state.rangeStart = clear ? "" : (src.rangeStart || ""); state.rangeEnd = clear ? "" : (src.rangeEnd || "");
    ttConfirm = null; showArchive = false; genPreview = null;
    genMsg = clear ? "보관한 시험을 복사했어요. 날짜를 이번 시험에 맞게 넣어 주세요." : "보관한 시험을 복사했어요. 날짜·과목을 이번 시험에 맞게 고치세요. 원본은 보관 목록에 그대로 있어요.";
    return commit();
  }
  if(a === "delArch"){
    const x = state.archive.find(y => y.id === b.dataset.id); if(!x) return;
    if(!armBtn(b, "arch"+x.id, "보관 삭제", "한 번 더 누르면 삭제")) return;
    pushUndo("tt", `보관한 시험 ‘${x.examTitle || "시험명 없음"}’ 삭제`);
    state.archive = state.archive.filter(y => y.id !== x.id); syncLastExam(); return commit();
  }
  if(a === "addEx"){
    const di = document.getElementById("exDate"), li = document.getElementById("exLabel");
    if(!di || !di.value){ genMsg = "제외할 날짜를 먼저 고르세요."; return render(); }
    const old = state.excludeDates.find(x => x.date === di.value);
    if(old) old.label = li.value.trim() || old.label; else state.excludeDates.push({date: di.value, label: li.value.trim()});
    genMsg = ""; if(genPreview) genPreview = makeGenPreview(); return commit();
  }
  if(a === "delEx"){ state.excludeDates = state.excludeDates.filter(x => x.date !== b.dataset.date); if(genPreview) genPreview = makeGenPreview(); return commit(); }
  if(a === "genDays"){
    const p = makeGenPreview();
    if(typeof p === "string"){ genMsg = p; genPreview = null; return render(); }
    genMsg = ""; genPreview = p; return render();
  }
  if(a === "genCancel"){ genPreview = null; return render(); }
  if(a === "genGo"){
    const p = makeGenPreview(); if(typeof p === "string" || !p.add.length){ genPreview = null; return render(); }
    pushUndo("tt", `평일 ${p.add.length}일 자동 생성`);
    p.add.forEach(iso => state.days.push({id:uid(), date: iso, periods: (state.defaultTimes.length ? state.defaultTimes : [""]).map(t => ({id:uid(), time:t, g:{"1":[],"2":[],"3":[]}}))}));
    genMsg = `평일 ${p.add.length}일을 추가했어요.`; genPreview = null;
    return commit();
  }
  if(a === "moreSlot"){ openSlots.add(b.dataset.key); render(); const [pid, gg] = b.dataset.key.split(":"); const sels = main.querySelectorAll(`select[data-pick="${pid}"][data-g="${gg}"]`); if(sels.length) sels[sels.length-1].focus(); return; }
  if(a === "addPeriod"){ const d = findDay(b.dataset.day); d.periods.push({id:uid(), time: state.defaultTimes[d.periods.length] || "", g:{"1":[],"2":[],"3":[]}}); return commit(); }
  if(a === "delPeriod"){
    const d = findDay(b.dataset.day); if(!d) return;
    const i = d.periods.findIndex(p => p.id === b.dataset.p), p = d.periods[i];
    if(p && ["1","2","3"].some(gg => (p.g[gg]||[]).length) && !armBtn(b, "per"+p.id, "×", "삭제?")) return;
    pushUndo("tt", `${dateLabel(d.date)} ${i+1}교시 삭제`);
    d.periods = d.periods.filter(p => p.id !== b.dataset.p); return commit();
  }
  if(a === "rmItem"){ const p = findPeriod(b.dataset.day, b.dataset.p); p.g[g] = p.g[g].filter(id => id !== b.dataset.id); return commit(); }
  if(a === "addRoom"){ state.rooms.push({id:uid(), label:`${state.rooms.length+1}학년 교실`, grades:["2","3"], print:true}); return commit(); }
  if(a === "delRoom"){
    const r = state.rooms.find(x => x.id === b.dataset.id); if(!r) return;
    if(state.rooms.length < 2){ flash("교실은 하나 이상 있어야 해요."); return; }
    if(!armBtn(b, "room"+r.id, "×", "삭제?")) return;
    pushUndo("tt", `교실 ‘${r.label || "교실"}’ 삭제`);
    state.rooms = state.rooms.filter(x => x.id !== r.id); return commit();
  }
  if(a === "pdfRoom" || a === "pdfAll" || a === "pdfSel"){
    const ne = ttCheck().filter(x => x.lv === "err").length;
    if(ne && !armBtn(b, "pdf"+a+(b.dataset.id||""), b.textContent, `오류 ${ne}건 — 그래도 저장하려면 한 번 더`, 4000)) return;
    if(a === "pdfRoom"){ const r = state.rooms.find(x => x.id === b.dataset.id); savePdf([r], pdfName(`${r.label||"교실"}(${r.grades[0]}·${r.grades[1]}학년)`)); return; }
    if(a === "pdfAll"){ savePdf(state.rooms, pdfName("전체")); return; }
    const rs = state.rooms.filter(r => r.print !== false); savePdf(rs, pdfName(rs.length === state.rooms.length ? "전체" : rs.map(r => r.label || "교실").join("+"))); return;
  }
});
main.addEventListener("input", e => {
  const t = e.target;
  if(app === "seat"){
    if(!seat) return;
    if(t.dataset.ssetText){ seat[t.dataset.ssetText] = t.value; commitSeat(false); }
    else if(t.dataset.sf === "label"){ AR().label = t.value; commitSeat(false); }
    return;
  }
  if(t.dataset.sub){ const s = subjById(t.dataset.g, t.dataset.sub); if(s){ s[t.dataset.f] = t.value; commit(false); } }
  else if(t.dataset.dt !== undefined){ state.defaultTimes[+t.dataset.dt] = t.value; commit(false); }
  else if(t.dataset.ptime){ const p = findPeriod(t.dataset.day, t.dataset.ptime); if(p){ p.time = t.value; commit(false); } }
  else if(t.dataset.rlabel){ const r = state.rooms.find(x => x.id === t.dataset.rlabel); if(r){ r.label = t.value; commit(false); } }
  else if(t.dataset.setText){ state[t.dataset.setText] = t.value; commit(false); }
});
main.addEventListener("change", e => { inChange = true; try { onMainChange(e); } finally { inChange = false; } });
function onMainChange(e){
  const t = e.target;
  if(app === "seat"){ if(seat) onSeatChange(t); return; }
  if("copydates" in t.dataset){ if(ttConfirm) ttConfirm.dates = t.value; return; }
  if(t.dataset.pick){
    const p = findPeriod(t.dataset.day, t.dataset.pick), g = t.dataset.g, i = +t.dataset.i, v = t.value;
    if(!p) return;
    const ids = p.g[g] = p.g[g] || [];
    if(i < ids.length){ if(v) ids[i] = v; else ids.splice(i, 1); }
    else if(v && !ids.includes(v)) ids.push(v);
    if(v === SELF){ p.g[g] = [SELF].concat(ids.filter(x => x !== SELF)); }
    openSlots.delete(p.id + ":" + g);
    commit();
    const nx = document.getElementById(t.id); if(nx) nx.focus();
    return;
  }
  if(t.dataset.print){ const r = state.rooms.find(x => x.id === t.dataset.print); if(r){ r.print = t.checked; commit(); } return; }
  if(t.dataset.setText){ state[t.dataset.setText] = t.value; commit(t.id === "examTitle" ? false : false); return; }
  if(t.dataset.addto){ if(!t.value) return; const p = findPeriod(t.dataset.day, t.dataset.addto); const g = t.dataset.g;
    if(p && !p.g[g].includes(t.value)){ if(t.value === SELF) p.g[g] = [SELF].concat(p.g[g]); else p.g[g].push(t.value); }
    commit(); const nx = document.getElementById(`add-${t.dataset.addto}-${g}`); if(nx) nx.focus(); return; }
  if(t.dataset.ddate){ const d = findDay(t.dataset.ddate); if(d){ d.date = t.value; commit(); } return; }
  if(t.dataset.rg){ const r = state.rooms.find(x => x.id === t.dataset.rg); if(r){ r.grades[+t.dataset.i] = t.value; commit(); } return; }
  if(t.dataset.set){ state[t.dataset.set] = t.type === "checkbox" ? t.checked : t.value; commit(); return; }
  if(t.dataset.sub || t.dataset.rlabel) render();
}

/* ---------- 백업 ---------- */
const footMsg = document.getElementById("footMsg"), importBox = document.getElementById("importBox");
// 기존 형식(시간표 필드가 최상위)을 그대로 두고 자리 배치는 seatPlans 키에만 담음 → 예전 파일·예전 앱과 호환
async function doExport(){
  const out = Object.assign({app:"시험장 세팅 도우미", exportedAt: new Date().toISOString()}, state); if(seat) out.seatPlans = seat;
  const data = JSON.stringify(out, null, 2), name = `시험장세팅도우미_백업_${toISO(new Date())}_${hhmm(new Date()).replace(":","")}.json`;
  const dl = await cap("downloads");
  if(dl){
    try { await dl.save({filename:name, data}); flash(`백업 파일을 저장했어요 · ${name}`); return true; }
    catch(e){ flash(e && e.code === "declined" ? "백업 저장을 취소했어요." : "이 화면에서는 파일을 저장할 수 없어요. 저장되지 않았어요."); return false; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  flash(`${name} 내려받기를 시작했어요. 아무 일도 없으면 이 화면에서는 저장이 막혀 있는 거예요.`);
  return true;
}
document.getElementById("exportJson").addEventListener("click", doExport);
let pendingImport = null;
function ttDesc(s){ const sm = examSummary(s), nSub = ["1","2","3"].reduce((n,g) => n + s.subjects[g].length, 0); return `시험명 ‘${s.examTitle || "없음"}’ · 시험일 ${sm.days}일 · 과목 ${nSub}개 · 교실 ${s.rooms.length}개 · 보관한 시험 ${s.archive.length}개`; }
const seatDesc = s => `시험실 ${s.rooms.length}개 (${s.rooms.slice(0,4).map(r => r.label || "교실").join(", ")}${s.rooms.length > 4 ? " …" : ""}) · 저장한 교실 구조 ${s.templates.length}개`;
function showImportBox(){
  if(!pendingImport){ importBox.hidden = true; importBox.innerHTML = ""; return; }
  const P = pendingImport;
  if(P.error){ importBox.hidden = false; importBox.innerHTML = `<div class="imp" style="border-color:var(--danger)"><b>가져오지 못했어요 — ${esc(P.name)}</b><span>${esc(P.error)}</span><span class="hint">지금 데이터는 하나도 바뀌지 않았어요.</span><div class="row"><button class="btn" data-imp="cancel">닫기</button></div></div>`; return; }
  importBox.hidden = false;
  importBox.innerHTML = `<div class="imp" role="dialog" aria-label="백업 가져오기 확인">
    <b>백업 파일 가져오기 — ${esc(P.name)}</b>
    ${P.notes && P.notes.length ? `<div class="warnline"><b>파일 점검 결과</b><br>${P.notes.map(esc).join("<br>")}</div>` : `<span class="hint">파일 점검: 형식·식별자·참조 관계에 문제가 없어요.</span>`}
    <span class="hint">가져올 항목을 고르세요. 고른 항목만 파일 내용으로 <b>바뀌고</b>, 나머지는 그대로예요. 가져온 뒤에도 ‘되돌리기’로 돌아갈 수 있어요.</span>
    ${P.tt ? `<label class="check"><input type="checkbox" data-impk="tt" ${P.useTT ? "checked" : ""}> <span><b>시험 시간표</b> — 파일: ${esc(ttDesc(P.tt))}<br><small class="hint">지금 데이터(${esc(ttDesc(state))})를 덮어써요.</small></span></label>` : `<span class="hint">· 이 파일에는 시험 시간표가 없어요 → 지금 시간표는 그대로예요.</span>`}
    ${P.seat ? `<label class="check"><input type="checkbox" data-impk="seat" ${P.useSeat ? "checked" : ""}> <span><b>시험 자리 배치</b> — 파일: ${esc(seatDesc(P.seat))}<br><small class="hint">${seat ? `지금 데이터(${esc(seatDesc(seat))})를 덮어써요.` : "지금은 자리 배치 데이터가 없어요."}</small></span></label>` : `<span class="hint">· 이 파일에는 자리 배치가 없어요 (예전 버전 백업) → 지금 자리 배치는 그대로예요.</span>`}
    <div class="row"><button class="btn" data-imp="backup">지금 데이터 먼저 백업 받기</button><span style="flex:1"></span>
      <button class="btn primary" data-imp="go" ${(P.useTT && P.tt) || (P.useSeat && P.seat) ? "" : "disabled"}>고른 항목 가져오기</button><button class="btn" data-imp="cancel">취소</button></div></div>`;
}
document.getElementById("importJson").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f) return;
  pendingImport = {name: f.name};
  try {
    if(f.size > 5 * 1024 * 1024) throw new Error(`파일이 너무 커요 (${(f.size/1024/1024).toFixed(1)}MB). 이 앱의 백업 파일은 보통 1MB보다 작아요. 다른 파일인지 확인하세요.`);
    let d;
    try { d = JSON.parse(await f.text()); } catch(err){ throw new Error("JSON 형식이 아니에요. ‘백업 파일 내보내기’로 만든 .json 파일인지 확인하세요."); }
    if(!d || typeof d !== "object" || Array.isArray(d)) throw new Error("파일 내용이 비어 있거나 백업 형식이 아니에요.");
    // 미리 정리해 보고, 실패하면 지금 데이터는 건드리지 않음
    if(d.subjects && typeof d.subjects === "object"){ const tt = Object.assign({}, d); delete tt.seatPlans; delete tt.app; delete tt.exportedAt; pendingImport.tt = normalize(JSON.parse(JSON.stringify(tt))); pendingImport.useTT = true; }
    const sp = d.seatPlans || (Array.isArray(d.rooms) && d.rooms.some(r => r && Array.isArray(r.cells)) ? d : null);
    if(sp && typeof sp === "object"){ pendingImport.seat = normalizeSeat(JSON.parse(JSON.stringify(sp))); pendingImport.useSeat = true; }
    // 참조 관계·식별자 점검 (정리 전 원본 기준) — 결과는 가져오기 전에 보여 줌
    const notes = [];
    if(pendingImport.tt){
      const raw = d.subjects || {}, ids = new Set(), dup = new Set();
      ["1","2","3"].forEach(g => (Array.isArray(raw[g]) ? raw[g] : []).forEach(x => { if(x && x.id){ if(ids.has(x.id)) dup.add(x.id); ids.add(x.id); } }));
      let missing = 0; (Array.isArray(d.days) ? d.days : []).forEach(day => (day && Array.isArray(day.periods) ? day.periods : []).forEach(p => ["1","2","3"].forEach(g => ((p && p.g && Array.isArray(p.g[g])) ? p.g[g] : []).forEach(id => { if(id !== SELF && !ids.has(id)) missing++; }))));
      if(dup.size) notes.push(`과목 식별자 ${dup.size}개가 겹쳐 있어 새 식별자를 붙여요.`);
      if(missing) notes.push(`시간표에 과목 목록에 없는 과목 ${missing}칸이 있어요 — 가져온 뒤 점검에서 ‘지워진 과목’으로 표시돼요.`);
      if(d.v !== undefined && d.v !== 1) notes.push(`데이터 버전이 ${d.v}이에요(이 앱은 1). 읽을 수 있는 부분만 가져와요.`);
    }
    if(pendingImport.seat){
      const rr = Array.isArray(sp.rooms) ? sp.rooms : [], rid = new Set(); let dupR = 0;
      rr.forEach(r => { if(r && r.id){ if(rid.has(r.id)) dupR++; rid.add(r.id); } });
      if(dupR) notes.push(`시험실 식별자 ${dupR}개가 겹쳐 있어요.`);
      if(sp.active && !rid.has(sp.active)) notes.push("선택돼 있던 시험실이 파일에 없어 첫 시험실을 선택해요.");
    }
    pendingImport.notes = notes;
    if(!pendingImport.tt && !pendingImport.seat) throw new Error("시험장 세팅 도우미 백업 파일이 아니에요 (예전 이름: 시험 준비 도우미·시험 시간표 메이커) — 시간표(subjects)나 자리 배치(seatPlans) 데이터가 없어요.");
  } catch(err){ pendingImport = {name: f.name, error: err && err.message || "파일을 읽지 못했어요."}; }
  showImportBox(); importBox.scrollIntoView({block:"nearest"});
});
importBox.addEventListener("change", e => { const k = e.target.dataset.impk; if(!k || !pendingImport) return; if(k === "tt") pendingImport.useTT = e.target.checked; else pendingImport.useSeat = e.target.checked; showImportBox(); });
importBox.addEventListener("click", async e => {
  const b = e.target.closest("[data-imp]"); if(!b) return;
  const k = b.dataset.imp;
  if(k === "cancel"){ pendingImport = null; showImportBox(); return; }
  if(k === "backup"){ await doExport(); return; }
  if(k === "go" && pendingImport){
    const P = pendingImport, got = [];
    if(P.tt && P.useTT){ pushUndo("tt", "백업 가져오기"); state = P.tt; syncCodeBook(); ttConfirm = null; genPreview = null; commit(false); got.push("시간표"); }
    if(P.seat && P.useSeat){ pushUndo("seat", "백업 가져오기"); seat = P.seat; selSeat = null; selStu = null; seatPending = null; commitSeat(false); got.push("자리 배치"); }
    pendingImport = null; showImportBox(); render();
    let ne = 0; try { ne = ttCheck().filter(x => x.lv === "err").length + (seat ? seat.rooms.reduce((n,r) => n + seatCheck(r).filter(c => c.lv === "err").length, 0) : 0); } catch(e){}
    flash(`${got.join(" · ")}를 가져왔어요.${got.length === 1 ? ` ${got[0] === "시간표" ? "자리 배치" : "시간표"}는 그대로예요.` : ""} 다시 점검한 결과: ${ne ? `필수 수정 ${ne}건 — 각 화면의 점검 결과를 확인하세요.` : "필수 수정 없음."}`);
  }
});
window.addEventListener("error", e => { flash(`문제가 생겼어요: ${e.message || "알 수 없는 오류"} — 데이터는 그대로예요. 계속 이상하면 백업을 받아 두고 새로고침하세요.`); });
boot();
window.__examApp = { drawSheet, buildSheets, starterState, getState: () => state, setState: s => { state = normalize(s); render(); },
  sync, drawSeatSheet, layout, roster, getSeat: () => seat, setSeat: s => { seat = normalizeSeat(s); render(); }, CODE_BOOK };
})();
</script>
