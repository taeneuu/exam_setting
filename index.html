<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>시험장 세팅 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gothic+A1:wght@900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic:wght@800&family=Noto+Sans+KR:wght@900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* 시험장 세팅 도우미 (구 시험 준비 도우미·시험 시간표 메이커) — 저장 키·데이터 구조는 예전 그대로 유지 */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#17202a; --muted:#5d6b78;
  --line:#d5dce2; --accent:#1d5c8f; --accent-ink:#ffffff; --accent-soft:#e3eef7;
  --warn:#a35a00; --warn-soft:#fff1dc; --danger:#b42318; --ok:#2e7d4f;
  --chip:#eef3f7; --chip-ink:#17324a; --self:#f1ecfa; --self-ink:#4a3477;
  --display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --radius:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171c; --surface:#1a2128; --surface-2:#202932; --ink:#e6ebef; --muted:#9aa8b4;
  --line:#2f3a45; --accent:#6aa8dc; --accent-ink:#0d1a26; --accent-soft:#1d3346;
  --warn:#f0b35c; --warn-soft:#3a2c17; --danger:#f2867c; --ok:#7fcf9e;
  --chip:#243341; --chip-ink:#d4e4f2; --self:#2e2640; --self-ink:#d6c8f5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1a2128; --surface-2:#202932; --ink:#e6ebef; --muted:#9aa8b4;
  --line:#2f3a45; --accent:#6aa8dc; --accent-ink:#0d1a26; --accent-soft:#1d3346;
  --warn:#f0b35c; --warn-soft:#3a2c17; --danger:#f2867c; --ok:#7fcf9e;
  --chip:#243341; --chip-ink:#d4e4f2; --self:#2e2640; --self-ink:#d6c8f5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:18px 10px}
header.top h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;letter-spacing:.01em}
header.top .sub{color:var(--muted);font-size:13px}
.status{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status[data-s="saved"] .dot{background:var(--ok)}
.status[data-s="saving"] .dot{background:var(--accent)}
.status[data-s="local"] .dot,.status[data-s="ro"] .dot{background:var(--warn)}
.status[data-s="error"] .dot{background:var(--danger)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:18px}
.navrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);margin-bottom:18px}
.navrow nav.tabs{border-bottom:0;margin-bottom:0;flex:1;min-width:0}
.navrow #undoBtn{white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis;font-size:13px}
/* 점검 결과 */
.checks{display:flex;flex-direction:column;gap:6px}
.checks .ck{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13px;padding:6px 10px;border-radius:6px;background:var(--surface-2)}
.checks .ck.err{background:color-mix(in srgb,var(--danger) 12%,var(--surface))}
.checks .ck.warn{background:var(--warn-soft)}
.checks .ck .tag{font-size:11.5px;font-weight:700;border-radius:4px;padding:0 6px;white-space:nowrap}
.checks .ck.err .tag{background:var(--danger);color:var(--surface)}
.checks .ck.warn .tag{background:var(--warn);color:var(--surface)}
.checks .ck.ok .tag{background:var(--ok);color:var(--surface)}
.checks .ck.info .tag{background:var(--muted);color:var(--surface)}
.checks .ck .go{margin-left:auto}
.cnt{border-radius:4px;padding:0 7px;font-size:12px;font-weight:700;color:var(--surface)}
.cnt.err{background:var(--danger)}
.sumbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;border-radius:var(--radius);padding:8px 14px;margin-bottom:12px;font-size:13.5px;border:1px solid var(--line);background:var(--surface)}
.sumbar.err{border-color:var(--danger);border-left-width:5px}
.sumbar.warn{border-color:var(--warn);border-left-width:5px}
.sumbar.ok{border-left:5px solid var(--ok)}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0 0;font-size:13px}
dl.facts dt{color:var(--muted);font-weight:600}
dl.facts dd{margin:0}.cnt.warn{background:var(--warn)}
.flashhl{outline:3px solid var(--danger)!important;outline-offset:2px}
.seat.err{outline:3px solid var(--danger);outline-offset:-3px}
.confirm{border:1.5px solid var(--danger);background:var(--surface);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.confirm ul{margin:0;padding-left:18px}
.xchips{display:flex;flex-wrap:wrap;gap:6px}
.xchip{display:inline-flex;align-items:center;gap:4px;background:var(--warn-soft);border-radius:5px;padding:2px 4px 2px 8px;font-size:13px}
.xchip button{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.arch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.arch:last-child{border-bottom:0}
.arch .meta{color:var(--muted);font-size:12.5px}
.imp{border:1.5px solid var(--accent);border-radius:var(--radius);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:8px;color:var(--ink);margin-top:6px}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px;margin-right:6px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
button,select,input{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0;color:var(--ink)}
textarea{width:100%;font:inherit;padding:8px}
.hint{color:var(--muted);font-size:13px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
h2.sec{font-size:17px;margin:0 0 4px;font-weight:700}
.btn{min-height:36px}
table.grid td.date .acts .btn,.numpick button,.more,.colhead,.seat,.stu,.linkbtn{min-height:0}

/* 과목 */
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.gcard{display:flex;flex-direction:column;gap:10px;min-width:0}
.gcard h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;display:flex;align-items:baseline;gap:8px}
.gcard h3 small{font-family:var(--body);font-size:12.5px;color:var(--muted)}
.subj-head,.subj{display:grid;grid-template-columns:1fr 72px 30px;gap:6px;align-items:center}
.subj-head{font-size:12px;color:var(--muted);padding-inline:2px}
.subj input.code{text-align:center;font-variant-numeric:tabular-nums}
.roomrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:6px;border-bottom:1px solid var(--line)}
.roomrow:last-of-type{border-bottom:0}
.roomrow input[type=text]{width:130px}
.roomrow .plus{color:var(--muted)}

/* 시간표 입력 표 */
.topform{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:end}
@media (max-width:760px){.topform{grid-template-columns:1fr}}
.topform input.title{width:100%;font-size:16px;font-weight:600;padding:7px 10px}
.toolrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.toolrow .lbl{font-size:12px;color:var(--muted);font-weight:600}
.toolrow input[type=date]{width:150px}
.toolrow .times input{width:108px}
table.grid{border-collapse:collapse;width:100%;min-width:640px}
table.grid th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.grid td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.grid tbody{border-top:2px solid var(--line)}
table.grid td.date{width:150px;vertical-align:top;background:var(--surface-2)}
table.grid td.date .wd{font-family:var(--display);font-size:18px;display:block;margin-bottom:4px}
table.grid td.date input{width:138px;font-size:13px}
table.grid td.date .acts{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
table.grid td.date .acts .btn{padding:3px 8px;font-size:12.5px}
table.grid td.no{width:52px;font-weight:600;white-space:nowrap}
table.grid td.time{width:124px}
table.grid td.time input{width:116px;font-variant-numeric:tabular-nums}
table.grid td.del{width:32px;text-align:center}
.pick{display:flex;align-items:center;gap:6px}
.pick + .pick{margin-top:4px}
.pick select{flex:1;min-width:110px;font-size:13.5px}
.pick select.blank{color:var(--muted);border-style:dashed}
.pick .code{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:30px}
.pick:not(:has(.more)){padding-right:25px}
.more{border:1px solid transparent;background:none;color:var(--muted);font-size:13px;line-height:1;padding:3px 5px;border-radius:4px;cursor:pointer}
.more:hover{color:var(--accent);border-color:var(--line)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:600}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg small{font-weight:400;color:var(--muted)}
details.more-set summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.more-set[open]{display:flex;flex-direction:column;gap:10px}
.target{display:flex;align-items:center;gap:8px;font-size:13.5px;padding-block:3px}
.target small{color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:13px;cursor:pointer;text-align:left}
details.paste summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500}
details.paste[open]{display:flex;flex-direction:column;gap:6px}

/* 일정 */
.unassigned{background:var(--warn-soft);border-radius:var(--radius);padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.unassigned b{color:var(--warn)}
.days{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.day-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.day-head .label{font-family:var(--display);font-size:20px;font-weight:400;margin-right:4px}
.day-head .spacer{flex:1}
.tablewrap{overflow-x:auto}
table.sched{border-collapse:collapse;width:100%;min-width:720px}
table.sched th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
table.sched td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.sched tr:last-child td{border-bottom:0}
table.sched td.no{font-family:var(--display);font-size:18px;text-align:center;width:40px;vertical-align:middle}
table.sched td.time{width:132px}
table.sched td.time input{width:122px;font-variant-numeric:tabular-nums}
table.sched td.del{width:36px;vertical-align:middle}
.cell{display:flex;flex-direction:column;gap:4px;min-width:150px}
.chip{display:flex;align-items:center;gap:4px;background:var(--chip);color:var(--chip-ink);border-radius:5px;padding:3px 4px 3px 8px;font-size:13px;font-weight:500}
.chip .c{font-variant-numeric:tabular-nums;opacity:.75;font-weight:400}
.chip.self{background:var(--self);color:var(--self-ink)}
.chip .x{margin-left:auto;border:0;background:none;color:inherit;opacity:.6;cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
.chip .x:hover{opacity:1}
.chip .dup{font-size:11px;color:var(--warn);font-weight:600}
.cell select{font-size:13px;color:var(--muted);border-style:dashed;width:100%}
.cell.off{opacity:.45}
.times{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.times label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.times input{width:118px;font-variant-numeric:tabular-nums}

/* 출력 */
.out-grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.out-grid{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.side{position:static}}
.field{display:flex;flex-direction:column;gap:4px}
.field > span{font-size:12px;color:var(--muted);font-weight:600}
.room{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px;background:var(--surface-2);border-radius:6px}
.room .gsel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);grid-column:1/-1}
.room .gsel select{flex:1}
.check{display:flex;align-items:center;gap:6px;font-size:13px}
.previews{display:flex;flex-direction:column;gap:20px;min-width:0}
.pv-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.pv-head h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.pv-head .meta{color:var(--muted);font-size:13px}
.pv-head .spacer{flex:1}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.page{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.page canvas{display:block;width:100%;height:auto}
.page .cap{font-size:12px;color:var(--muted);padding:4px 8px;background:var(--surface-2);border-top:1px solid var(--line)}
.msg{font-size:13px;padding:8px 12px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.msg.err{background:var(--warn-soft)}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
footer.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
footer.foot .spacer{flex:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* 도구 선택 (시간표 / 자리 배치) — 두 도구는 데이터가 완전히 따로예요 */
.wrap[data-app="seat"]{--accent:#2b6b55; --accent-soft:#e0efe8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wrap[data-app="seat"]{--accent:#6cc4a1; --accent-ink:#0b1f18; --accent-soft:#1a3a2f}}
:root[data-theme="dark"] .wrap[data-app="seat"]{--accent:#6cc4a1; --accent-ink:#0b1f18; --accent-soft:#1a3a2f}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.app{appearance:none;display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--ink);min-width:0}
.app:hover{border-color:var(--accent)}
.app .ic{font-size:24px;line-height:1}
.app b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.25}
.app small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .cardstat{color:var(--ink);font-weight:600;margin-top:2px}
nav.tabs button .st{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;border:1px solid currentColor;line-height:16px}
nav.tabs button .st-done{color:var(--ok)}
nav.tabs button .st-work{color:var(--accent)}
nav.tabs button .st-check{color:var(--danger)}
nav.tabs button .st-todo{color:var(--muted);border-style:dashed}
.inerr{outline:2px solid var(--danger)!important;outline-offset:1px}
.inwarn{outline:2px dashed var(--warn);outline-offset:1px}
tr.rowerr > td{background:color-mix(in srgb,var(--danger) 7%,transparent)}
.app[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
@media (max-width:560px){.app small:not(.cardstat){display:none}.app{padding:9px 10px;gap:8px}.app b{font-size:16px}}
.codebook{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px;padding:12px 16px}
.codebook b{font-size:14px}
.okmark{color:var(--ok);font-weight:600;font-size:13px}

/* 자리 배치 */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.rchip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer;font-weight:600}
.rchip small{font-weight:400;color:var(--muted);margin-left:6px}
.rchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.rchip[aria-pressed="true"] small{color:inherit;opacity:.85}
.seat-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
@media (max-width:980px){.seat-2col{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.stack{gap:10px}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:980px){.sticky{position:static}}
.lbl2{font-size:12px;color:var(--muted);font-weight:600;min-width:64px}
input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 4px;color:var(--ink);font-variant-numeric:tabular-nums;text-align:center}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:9px 10px;background:var(--surface-2);border-radius:6px;font-size:13.5px}
.grp input.num{width:58px}
.grp .grptag{font-size:12.5px;border:1.5px solid var(--ink);border-radius:4px;padding:0 6px;line-height:20px}
.grp input.abs{width:124px}
.grp .tot{margin-left:auto;font-size:13px;color:var(--muted)}
.grp .tot b{color:var(--ink);font-size:14px}
.numpick{display:flex;flex-wrap:wrap;gap:4px;width:100%;padding-top:4px}
.numpick button{width:36px;height:30px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:13px}

<script>
(function(){
"use strict";
const SELF = "__self";
const WEEK = ["일","월","화","수","목","금","토"];
const PAPERS = {
  B4:{label:"B4 가로 (364×257mm)", w:364, h:257},
  A4:{label:"A4 가로 (297×210mm)", w:297, h:210},
  A3:{label:"A3 가로 (420×297mm)", w:420, h:297}
};
const FONTS = {
  "Black Han Sans":{label:"검은고딕 (Black Han Sans)", weight:400},
  "Noto Sans KR":{label:"본고딕 Black (Noto Sans KR)", weight:900},
  "Gothic A1":{label:"고딕 A1 Black", weight:900},
  "Nanum Gothic":{label:"나눔고딕 ExtraBold", weight:800},
  "Do Hyeon":{label:"도현체", weight:400}
};
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function emptyState(){
  return {
    v:1,
    subjects:{"1":[],"2":[],"3":[]},
    defaultTimes:["09:20~10:10","10:30~11:20","11:40~12:30"],
    days:[],
    rooms:[
      {id:uid(), label:"1학년 교실", grades:["1","3"]},
      {id:uid(), label:"2학년 교실", grades:["1","2"]}
    ],
    paper:"B4", font:"Noto Sans KR", hideEmpty:true,
    examTitle:"", showTitle:true, showRoom:true, rangeStart:"", rangeEnd:"", lastExam:null, codeBook:"",
    excludeDates:[], archive:[]
  };
}
// 학교 과목코드표 (2026학년도 1학기 과목코드.hwpx)
const CODE_BOOK_ID = "2026-1", CODE_BOOK_TITLE = "2026학년도 1학기 과목코드표";
const CODE_BOOK = {
  "1":[["공통국어1","01"],["공통수학1","02"],["공통영어1","03"],["한국사1","04"],["통합사회1","05"],["통합과학1","06"],["과학탐구실험1","07"],["체육1","08"],["음악","09"],["미술","10"],["기술·가정","11"],["한문","12"]],
  "2":[["문학","01"],["대수","02"],["영어Ⅰ","03"],["세계시민과 지리","04"],["세계사","05"],["사회와 문화","06"],["정치","07"],["윤리와 사상","08"],["물리학","09"],["화학","10"],["생명과학","11"],["지구과학","12"],["스포츠 생활1","13"],["음악 연주와 창작","14"],["미술 창작","15"],["중국어","16"],["일본어","17"]],
  "3":[["화법과 작문","01"],["언어와 매체","02"],["고전 읽기","03"],["미적분","04"],["기하","05"],["경제 수학","06"],["수학과제 탐구","07"],["영어 독해와 작문","08"],["사회·문화","09"],["윤리와 사상","10"],["여행지리","11"],["사회문제 탐구","12"],["물리학Ⅱ","13"],["화학Ⅱ","14"],["생명과학Ⅱ","15"],["지구과학Ⅱ","16"],["생활과 과학","17"],["스포츠 생활","18"],["음악 이론","19"],["매체 미술","20"],["정보","21"],["프로그래밍","22"],["인공지능 기초","23"]]
};
// 띄어쓰기·가운뎃점·로마숫자 표기가 달라도 같은 과목으로 봄 (영어독해와 작문 = 영어 독해와 작문, 물리학II = 물리학Ⅱ)
const normName = s => String(s || "").replace(/\s+/g,"").replace(/[・·•ㆍ‧∙.]/g,"").replace(/Ⅲ/g,"III").replace(/Ⅱ/g,"II").replace(/Ⅰ/g,"I").toLowerCase();
const codeBookSubjects = () => { const o = {}; ["1","2","3"].forEach(g => o[g] = CODE_BOOK[g].map(([name,code]) => ({id:uid(), name, code}))); return o; };
// 6월 기말 시간표(첨부 자료)로 시작하는 예시 — 과목·코드는 과목코드표 기준
function starterState(){
  const s = emptyState();
  s.subjects = codeBookSubjects(); s.codeBook = CODE_BOOK_ID;
  const f = (g, name) => { const x = s.subjects[g].find(x => normName(x.name) === normName(name)); return x ? x.id : null; };
  const P = (time, g1, g3) => ({id:uid(), time, g:{"1":g1.map(n => n===SELF?SELF:f("1",n)).filter(Boolean), "2":[], "3":g3.map(n => f("3",n)).filter(Boolean)}});
  const T = s.defaultTimes;
  s.days = [
    {id:uid(), date:"2026-06-29", periods:[P(T[0],["한국사1"],["영어독해와 작문"]), P(T[1],["공통영어1"],["생명과학II"])]},
    {id:uid(), date:"2026-06-30", periods:[P(T[0],["통합과학1"],["화법과 작문","언어와 매체"]), P(T[1],["공통국어1"],["미적분"])]},
    {id:uid(), date:"2026-07-01", periods:[P(T[0],["기술·가정","한문"],["정보"]), P(T[1],["공통수학1"],["물리학II","윤리와 사상"]), P(T[2],[],["사회·문화"])]},
    {id:uid(), date:"2026-07-02", periods:[P(T[0],[SELF],["고전 읽기","기하"]), P(T[1],["통합사회1"],["화학II"])]}
  ];
  return normalize(s);
}
function normalize(d){
  const s = Object.assign(emptyState(), d || {});
  s.subjects = Object.assign({"1":[],"2":[],"3":[]}, s.subjects || {});
  ["1","2","3"].forEach(g => { if(!Array.isArray(s.subjects[g])) s.subjects[g] = []; });
  if(!Array.isArray(s.days)) s.days = [];
  s.days.forEach(day => { if(!Array.isArray(day.periods)) day.periods = [];
    day.periods.forEach(p => { p.g = Object.assign({"1":[],"2":[],"3":[]}, p.g || {}); }); });
  if(!Array.isArray(s.rooms) || !s.rooms.length) s.rooms = emptyState().rooms;
  if(!PAPERS[s.paper]) s.paper = "B4";
  if(!FONTS[s.font]) s.font = "Noto Sans KR";
  // 기본 글꼴을 본고딕 Black으로 바꾼 뒤 처음 한 번만, 예전 기본값(검은고딕)을 새 기본값으로 맞춤 (그 뒤 직접 고른 글꼴은 유지)
  if(!s.fontDefault2){ if(s.font === "Black Han Sans") s.font = "Noto Sans KR"; s.fontDefault2 = true; }
  if(!Array.isArray(s.defaultTimes)) s.defaultTimes = emptyState().defaultTimes;
  s.rooms.forEach(r => { if(!Array.isArray(r.grades) || r.grades.length < 2) r.grades = ["1","3"]; r.grades = r.grades.slice(0,2).map(g => ["1","2","3"].includes(String(g)) ? String(g) : "1"); if(r.print === undefined) r.print = true; });
  // 같은 식별자가 두 번 쓰이면(파일 직접 수정·병합 등) 뒤의 것에 새 식별자를 붙여 서로 섞이지 않게 함
  const seenId = new Set(), fresh = o => { if(!o.id || seenId.has(o.id)) o.id = uid(); seenId.add(o.id); };
  ["1","2","3"].forEach(g => s.subjects[g].forEach(fresh)); s.days.forEach(d => { fresh(d); d.periods.forEach(fresh); }); s.rooms.forEach(fresh);
  s.days.forEach(d => d.periods.forEach(p => ["1","2","3"].forEach(g => { if(!Array.isArray(p.g[g])) p.g[g] = []; p.g[g] = [...new Set(p.g[g].filter(x => typeof x === "string"))]; })));
  if(typeof s.examTitle !== "string") s.examTitle = "";
  if(s.lastExam && !Array.isArray(s.lastExam.days)) s.lastExam = null;
  // 제외 날짜(공휴일·재량휴업일)와 보관한 시험 목록 — 예전 데이터에는 없으므로 기본값으로 채움
  s.excludeDates = (Array.isArray(s.excludeDates) ? s.excludeDates : []).filter(x => x && /^\d{4}-\d{2}-\d{2}$/.test(x.date)).map(x => ({date:x.date, label:String(x.label || "")}));
  s.archive = (Array.isArray(s.archive) ? s.archive : []).filter(a => a && Array.isArray(a.days));
  if(s.lastExam && !s.archive.length) s.archive.push(Object.assign({}, s.lastExam)); // 예전 '이전 시험' 1개를 보관 목록으로 옮김
  s.archive = s.archive.map(a => Object.assign({id:uid(), examTitle:"", rangeStart:"", rangeEnd:"", savedAt:""}, a));
  s.archive.forEach(a => a.days.forEach(day => { if(!Array.isArray(day.periods)) day.periods = []; day.periods.forEach(p => { p.g = Object.assign({"1":[],"2":[],"3":[]}, p.g || {}); }); }));
  s.lastExam = s.archive[0] ? {examTitle:s.archive[0].examTitle, days:s.archive[0].days, rangeStart:s.archive[0].rangeStart, rangeEnd:s.archive[0].rangeEnd} : null;
  if(typeof s.codeBook !== "string") s.codeBook = "";
  delete s.seatPlans; delete s.app; delete s.exportedAt; delete s._meta; // 자리 배치 데이터·백업 표시는 시간표 state에 섞지 않음
  return s;
}

let state = emptyState();
let tab = "subjects";
let loaded = false, db = null, canWrite = true;
const LS_KEY = "exam-timetable-state-v1", LS_TAB = "exam-timetable-tab";
const LS_SEAT = "exam-seat-state-v1", LS_APP = "exam-app", LS_STAB = "exam-seat-tab";
let app = "tt", seatTab = "room", seat = null;
try { const t = localStorage.getItem(LS_TAB); if(t) tab = t; } catch(e){}
try { const raw = localStorage.getItem(LS_KEY); if(raw) state = normalize(JSON.parse(raw)); } catch(e){}
try { const a = localStorage.getItem(LS_APP); if(a === "tt" || a === "seat") app = a; } catch(e){}
try { const t = localStorage.getItem(LS_STAB); if(["room","place","print"].includes(t)) seatTab = t; } catch(e){}

/* ---------- 저장 (시간표 = app/state, 자리 배치 = app/seats — 서로 다른 문서) ---------- */
const statusEl = document.getElementById("status"), statusText = document.getElementById("statusText"), retryBtn = document.getElementById("retrySave");
function setStatus(s, t){ statusEl.dataset.s = s; statusText.textContent = t; if(retryBtn) retryBtn.hidden = !(s === "error" && dirty.size && ![...dirty].some(p => sync[p].loadFailed || sync[p].conflict)); }
/* ---------- 공유 저장소 동기화 ----------
   - 저장할 때 문서에 _meta {rev, at, client}를 함께 기록 (업무 데이터와 분리, 불러올 때 제거)
   - 저장 직전에 공유 저장소의 rev를 확인해 다른 기기가 더 새 데이터를 저장했으면 덮어쓰지 않고 멈춤
   - onSnapshot으로 다른 기기의 변경을 감지: 내 변경이 없으면 바로 반영, 있으면 충돌 안내
   - 처음 불러오기에 실패하면 그 문서는 공유 저장소에 쓰지 않음 (오래된 사본으로 덮어쓰기 방지)
   저장소 API는 last-writer-wins라 확인과 쓰기 사이의 아주 짧은 순간까지 막을 수는 없음 */
const CLIENT = uid() + uid();
const DOCS = {
  "app/state": {name:"시험 시간표", which:"tt", get: () => state, put: d => { state = normalize(d); }, ls: () => LS_KEY, hasLocal: () => hasContent(state)},
  "app/seats": {name:"시험 자리 배치", which:"seat", get: () => seat, put: d => { seat = normalizeSeat(d); }, ls: () => LS_SEAT, hasLocal: () => !!seat}
};
const sync = {"app/state":{rev:0}, "app/seats":{rev:0}};
const saveTimers = {}, saveVer = {}, dirty = new Set();
let lsFail = false;
const hhmm = d => `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const fmtAt = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? `${d.getMonth()+1}/${d.getDate()} ${hhmm(d)}` : "시각 모름"; };
function persist(docPath){
  if(!loaded) return;
  if(!db){
    setStatus(lsFail ? "error" : "local", lsFail ? "저장 실패 — 이 브라우저에 저장할 공간이 없어요. 아래 '백업 파일 내보내기'로 파일을 받아 두세요." : `이 브라우저에만 저장됨 · ${hhmm(new Date())}`);
    return;
  }
  if(!canWrite){ setStatus("ro","보기 전용 — 변경 내용은 이 브라우저에만 남아요"); return; }
  const S = sync[docPath];
  saveVer[docPath] = (saveVer[docPath] || 0) + 1; dirty.add(docPath);

async function flush(docPath, force){

function makeGenPreview(){
  const s0 = parseDate(state.rangeStart), e0 = parseDate(state.rangeEnd || state.rangeStart);
  if(!s0 || !e0 || e0 < s0) return "시험 기간의 시작일과 종료일을 확인해 주세요.";
  if((e0 - s0) / 864e5 > 31) return "기간은 31일 이내로 넣어 주세요.";
  const ex = new Map(state.excludeDates.map(x => [x.date, x.label])), have = new Set(state.days.map(d => d.date));
  const out = {add:[], weekend:0, excl:[], exist:[]};
  for(const d = new Date(s0); d <= e0; d.setDate(d.getDate()+1)){
    const iso = toISO(d);
    if(d.getDay() === 0 || d.getDay() === 6) out.weekend++;
    else if(ex.has(iso)) out.excl.push({date: iso, label: ex.get(iso)});
    else if(have.has(iso)) out.exist.push(iso);
    else out.add.push(iso);
  }
  return out;
}

  render();
  let el = id ? document.getElementById(id) : null;
  if(!el && i !== "" && i !== undefined) el = main.querySelector(`[data-sact="seat"][data-i="${i}"]`);

/* ---------- 시간표 입력 점검 ---------- */
function parseSpan(t){
  const m = String(t || "").trim().match(/^(\d{1,2})\s*[:시]\s*(\d{2})\s*분?\s*[~\-–～]\s*(\d{1,2})\s*[:시]\s*(\d{2})/);
  if(!m) return null;
  const a = +m[1]*60 + +m[2], b = +m[3]*60 + +m[4];
  return (+m[1] > 23 || +m[3] > 23 || +m[2] > 59 || +m[4] > 59) ? null : [a, b];
}
function ttCheck(){
  const items = [];
  const E = (msg, go) => items.push({lv:"err", msg, go}), W = (msg, go) => items.push({lv:"warn", msg, go});
  const grades = activeGrades(), today = toISO(new Date());
  const ex = new Map(state.excludeDates.map(x => [x.date, x.label]));
  // 과목 목록
  ["1","2","3"].forEach(g => {
    const seen = {};
    state.subjects[g].forEach(s => {
      if(!s.name.trim()){ W(`${g}학년 과목 목록에 이름이 빈 과목이 있어요. 이름을 넣거나 × 로 지우세요.`, {tab:"subjects", id:"sn-"+s.id}); return; }
      const k = normName(s.name);
      if(s.name.trim().length > 16) W(`${g}학년 ‘${s.name}’은 이름이 길어서 시간표에서 글씨가 좁게 찍힐 수 있어요. 미리보기로 확인하세요.`, {tab:"output"});
      const code = String(s.code || "").trim();
      if(code){ const twin = state.subjects[g].find(o => o !== s && String(o.code || "").trim() === code && normName(o.name) !== k); if(twin && state.subjects[g].indexOf(twin) < state.subjects[g].indexOf(s)) W(`${g}학년 ‘${twin.name}’과 ‘${s.name}’의 과목코드가 같아요(${code}). 코드표를 확인하세요.`, {tab:"subjects", id:"sc-"+s.id}); }
      if(seen[k]) W(`${g}학년에 ‘${s.name}’이 두 번 등록돼 있어요. 하나를 지우세요. (다른 학년의 같은 이름은 괜찮아요)`, {tab:"subjects", id:"sn-"+s.id});
      seen[k] = 1;
    });
  });
  if(!state.days.length) W("시험 날짜가 아직 없어요. 시험 기간을 넣고 ‘평일 자동 생성’을 누르세요.", {tab:"schedule", id:"rangeStart"});
  const dates = {}, past = [], placed = {};
  sortedDays().forEach(d => {
    const lab = dateLabel(d.date);
    if(!d.date) E("날짜가 비어 있는 시험일이 있어요. 날짜를 넣어 주세요.", {tab:"schedule", id:"dd-"+d.id});
    else if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date) || !parseDate(d.date) || toISO(parseDate(d.date)) !== d.date) E(`날짜 ‘${d.date}’의 형식이 잘못됐어요. 날짜 칸에서 다시 골라 주세요.`, {tab:"schedule", id:"dd-"+d.id});
    else {
      if(dates[d.date]) E(`${lab}이 두 번 들어 있어요. 한쪽 날짜를 고치거나 삭제하세요.`, {tab:"schedule", id:"dd-"+d.id});
      dates[d.date] = 1;
      const wd = parseDate(d.date).getDay();
      if(wd === 0 || wd === 6) W(`${lab}은 주말이에요. 날짜가 맞는지 확인하세요.`, {tab:"schedule", id:"dd-"+d.id});
      if(ex.has(d.date)) W(`${lab}은 제외 날짜${ex.get(d.date) ? `(${ex.get(d.date)})` : ""}로 지정돼 있어요.`, {tab:"schedule", id:"dd-"+d.id});
      if(d.date < today) past.push({d, lab});
    }
    if(!d.periods.length) W(`${lab}에 교시가 없어요. ‘+ 교시’를 누르거나 날짜를 삭제하세요.`, {tab:"schedule", id:"dd-"+d.id});
    if(d.periods.length > 6) W(`${lab}은 교시가 ${d.periods.length}개라 출력물 글씨가 작아질 수 있어요. 미리보기로 확인하세요.`, {tab:"output"});
    const spans = [];
    d.periods.forEach((p, i) => {
      const pl = `${lab} ${i+1}교시`;
      const any = grades.some(g => (p.g[g] || []).length);
      if(!String(p.time).trim()){ (any ? E : W)(`${pl}의 시험시간이 비어 있어요.`, {tab:"schedule", id:"pt-"+p.id}); }
      else {
        const t = parseSpan(p.time);
        if(!t) W(`${pl} 시험시간 ‘${p.time}’을 읽지 못했어요. 09:00~09:50처럼 써 주세요.`, {tab:"schedule", id:"pt-"+p.id});
        else if(t[1] <= t[0]) E(`${pl}: 끝나는 시각이 시작 시각보다 빨라요 (${p.time}).`, {tab:"schedule", id:"pt-"+p.id});
        else spans.push({i, t, p});
      }
      if(!any) W(`${pl}에 과목이 하나도 없어요${state.hideEmpty ? " (출력에서는 빠져요)" : ""}.`, {tab:"schedule", id:`pk-${p.id}-${grades[0]}-0`});
      grades.forEach(g => {
        const arr = p.g[g] || [];
        if(arr.includes(SELF) && arr.length > 1) W(`${pl} ${g}학년에 자습과 시험 과목이 함께 들어 있어요.`, {tab:"schedule", id:`pk-${p.id}-${g}-0`});
        arr.forEach((id, k) => {
          if(id === SELF) return;
          const s = subjById(g, id);
          if(!s) E(`${pl} ${g}학년에 과목 목록에서 지워진 과목이 남아 있어요. 다시 고르세요.`, {tab:"schedule", id:`pk-${p.id}-${g}-${k}`});
          else {
            if(!s.name.trim()) E(`${pl} ${g}학년에 이름이 빈 과목이 들어 있어요.`, {tab:"subjects", id:"sn-"+s.id});
            (placed[g+":"+id] = placed[g+":"+id] || []).push({pl, go:{tab:"schedule", id:`pk-${p.id}-${g}-${k}`}, name:s.name, g});
          }
        });
      });
    });
    spans.sort((a,b) => a.t[0] - b.t[0]);
    for(let k = 1; k < spans.length; k++) if(spans[k].t[0] < spans[k-1].t[1]) E(`${lab} ${spans[k-1].i+1}교시(${spans[k-1].p.time})와 ${spans[k].i+1}교시(${spans[k].p.time}) 시험시간이 겹쳐요.`, {tab:"schedule", id:"pt-"+spans[k].p.id});
    if(spans.some((x,k) => k && x.i < spans[k-1].i)) W(`${lab}의 교시 순서와 시험시간 순서가 달라요.`, {tab:"schedule", id:"pt-"+spans[0].p.id});
  });
  if(past.length) W(`이미 지난 날짜가 ${past.length}일 있어요 (${past.slice(0,3).map(x => x.lab).join(", ")}${past.length > 3 ? " …" : ""}). 예전 시험 날짜가 남아 있지 않은지 확인하세요.`, {tab:"schedule", id:"dd-"+past[0].d.id});
  Object.values(placed).forEach(list => { if(list.length > 1) W(`${list[0].g}학년 ‘${list[0].name}’이 ${list.map(x => x.pl).join(", ")}에 두 번 이상 들어 있어요. 의도한 게 아니라면 하나를 지우세요.`, list[1].go); });
  if(state.days.length) grades.forEach(g => {
    const miss = state.subjects[g].filter(s => s.name.trim() && !placed[g+":"+s.id]);
    if(miss.length) W(`${g}학년 시간표에 아직 넣지 않은 과목 ${miss.length}개: ${miss.slice(0,8).map(s => s.name).join(", ")}${miss.length > 8 ? " …" : ""} (시험이 없는 과목이면 그대로 두세요)`, {tab:"schedule"});
  });
  state.rooms.forEach(r => {
    if(r.grades[0] === r.grades[1]) W(`교실 ‘${r.label || "교실"}’의 두 열이 모두 ${r.grades[0]}학년이에요.`, {tab:"subjects", id:"rg1-"+r.id});
    if(state.days.length && !buildSheets(r).length) W(`‘${r.label || "교실"}’(${r.grades.join("·")}학년)은 출력할 시간표가 없어요.`, {tab:"output"});
  });
  return items;
}

function checksHTML(items, title, okText, compact, scope){
  const ne = items.filter(x => x.lv === "err").length, nw = items.filter(x => x.lv === "warn").length;
  const head = `<div class="row" style="margin-bottom:8px"><h2 class="sec" style="margin:0">${title}</h2>
    ${ne ? `<span class="cnt err">꼭 고칠 것 ${ne}</span>` : ""}
    ${nw ? `<span class="cnt warn">확인할 것 ${nw}</span>` : ""}
    ${!ne && !nw ? `<span class="okmark">✓ ${okText || "문제 없어요"}</span>` : ""}</div>
    ${scope ? `<p class="hint" style="margin:0 0 8px">점검한 항목: ${scope}${!ne && !nw ? " — 모두 통과했어요. 점검으로 알 수 없는 내용(과목 배정이 맞는지 등)은 미리보기로 직접 확인하세요." : ""}</p>` : ""}`;
  const row = x => `<div class="ck ${x.lv}"><span class="tag">${({err:"오류", warn:"확인", info:"참고", ok:"정상"})[x.lv]}</span><span>${esc(x.msg)}</span>
      ${x.go ? `<button class="linkbtn go" data-act="goFix" data-tab="${x.go.tab || ""}" data-id="${x.go.id || ""}" data-rid="${x.go.rid || ""}" data-i="${x.go.i ?? ""}">고치러 가기</button>` : ""}</div>`;
  if(compact){
    const errs = items.filter(x => x.lv === "err"), rest = items.filter(x => x.lv !== "err");
    return head + (errs.length ? `<div class="checks">${errs.map(row).join("")}</div>` : "") + (rest.length ? `<details class="more-set" style="margin-top:6px"><summary>확인할 것 ${rest.length}개 보기</summary><div class="checks">${rest.map(row).join("")}</div></details>` : "");
  }
  return head + (items.length ? `<div class="checks" aria-live="polite">${items.map(row).join("")}</div>` : "");
}

        <div style="margin-top:10px">${checksHTML(ttCheck(), "점검 결과", "출력해도 돼요", true)}</div></div>

          <button class="btn" data-act="pdfAll" ${total && window.jspdf ? "" : "disabled"} title="${!window.jspdf ? "PDF 도구를 불러오지 못했어요" : total ? "" : "출력할 시간표가 없어요 — 시간표 입력에서 과목을 넣으세요"}">모든 교실 PDF (${total}장)</button>

/* ---------- 시간표 한 장 데이터 ---------- */
function buildSheets(room){
  const out = [];
  const title = state.showTitle ? (state.examTitle || "").trim() : "";
  sortedDays().forEach(d => {
    const rows = [];
    d.periods.forEach((p,i) => {
      const cells = room.grades.map(g => (p.g[g]||[]).map(id => {
        if(id === SELF) return {self:true};
        const s = subjById(g, id); return s ? {name:s.name, code:s.code} : null;
      }).filter(Boolean));
      if(state.hideEmpty && cells.every(c => !c.length)) return;
      rows.push({no:i+1, time:p.time, cells});
    });
    if(rows.length) out.push({dateLabel: dateLabel(d.date), grades: room.grades, rows, title, roomLabel: state.showRoom ? (room.label || "") : ""});
  });
  return out;
}

/* ---------- 그리기 (미리보기와 PDF가 같은 함수를 씀) ---------- */
function drawSheet(ctx, W, H, sh, fam){
  const weight = FONTS[fam] ? FONTS[fam].weight : 400;
  const U = W/1000;
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#000"; ctx.strokeStyle = "#000";
  const hasTitle = !!(sh.title && sh.title.trim());
  const x0 = W*0.031, x1 = W*0.975, y0 = H*(hasTitle ? 0.125 : 0.083), y1 = H*0.925;
  const tw = x1-x0, th = y1-y0;
  const fr = [0.073,0.447,0.24,0.24], fs = fr.reduce((a,b)=>a+b,0);
  const xs = [x0]; fr.forEach(f => xs.push(xs[xs.length-1] + tw*f/fs));
  const n = sh.rows.length;
  const hh = th/(n*1.9+1), rh = (th-hh)/n;
  ctx.lineWidth = Math.max(1, W*0.0011);
  const line = (ax,ay,bx,by) => { ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); };
  ctx.strokeRect(x0,y0,tw,th);
  line(x0,y0+hh,x1,y0+hh);
  for(let i=1;i<n;i++) line(x0,y0+hh+i*rh,x1,y0+hh+i*rh);
  line(xs[1],y0+hh,xs[1],y1); line(xs[2],y0,xs[2],y1); line(xs[3],y0,xs[3],y1);

  const text = (str, cx, cy, maxW, size, minScale) => {
    minScale = minScale || 0.62;
    const setF = sz => { ctx.font = `${weight} ${sz}px "${fam}", "Noto Sans KR", "Malgun Gothic", sans-serif`; };
    setF(size);
    let w = ctx.measureText(str).width, sx = 1;
    if(w > maxW){
      sx = maxW / w;
      if(sx < minScale){ size = size*sx/minScale; setF(size); w = ctx.measureText(str).width; sx = Math.min(1, maxW/w); }
    }
    const m = ctx.measureText("가0");
    const asc = m.actualBoundingBoxAscent || size*0.8, desc = m.actualBoundingBoxDescent || size*0.1;
    ctx.save(); ctx.translate(cx, cy + (asc-desc)/2); ctx.scale(sx,1);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillText(str, 0, 0); ctx.restore();
  };
  // 시험명 (표 위)
  if(hasTitle) text(sh.title.trim(), (x0+x1)/2, H*0.068, tw*0.9, Math.min(44*U, H*0.055));
  // 교실 이름 (분류용, 작게)
  if(sh.roomLabel){
    ctx.save(); ctx.fillStyle = "#8a8a8a"; ctx.font = `400 ${Math.round(13*U)}px "Noto Sans KR", "Malgun Gothic", sans-serif`;
    ctx.textAlign = "right"; ctx.textBaseline = "alphabetic"; ctx.fillText(sh.roomLabel, x1, H*0.962); ctx.restore();
    ctx.fillStyle = "#000";
  }
  // 머리행
  const fh = Math.min(58*U, hh*0.56);
  text(sh.dateLabel, (xs[0]+xs[2])/2, y0+hh/2, (xs[2]-xs[0])*0.9, fh);
  sh.grades.forEach((g,i) => text(`${g}학년`, (xs[2+i]+xs[3+i])/2, y0+hh/2, (xs[3+i]-xs[2+i])*0.88, fh));
  // 교시행
  sh.rows.forEach((r, ri) => {
    const top = y0+hh+ri*rh, cy = top+rh/2;
    text(String(r.no), (xs[0]+xs[1])/2, cy, (xs[1]-xs[0])*0.8, Math.min(56*U, rh*0.42));
    text(r.time || "", (xs[1]+xs[2])/2, cy, (xs[2]-xs[1])*0.93, Math.min(120*U, rh*0.56), 0.5);
    r.cells.forEach((items, ci) => {
      const cx0 = xs[2+ci], cx1 = xs[3+ci], cw = cx1-cx0, ccx = (cx0+cx1)/2;
      if(!items.length) return;
      if(items.length === 1){
        const it = items[0];
        if(it.self){ text("자습", ccx, cy, cw*0.86, Math.min(62*U, rh*0.36)); return; }
        const f = Math.min(56*U, rh*0.3);
        if(it.code){
          text(it.name, ccx, top+rh*0.34, cw*0.9, f, 0.55);
          text(`(${it.code})`, ccx, top+rh*0.69, cw*0.9, f);
        } else text(it.name, ccx, cy, cw*0.9, f, 0.55);
        return;
      }
      const k = items.length, sub = rh/k;
      for(let j=1;j<k;j++) line(cx0, top+j*sub, cx1, top+j*sub);
      items.forEach((it, j) => {
        const s = it.self ? "자습" : (it.code ? `${it.name} (${it.code})` : it.name);
        text(s, ccx, top+j*sub+sub/2, cw*0.92, Math.min(42*U, sub*0.5), 0.55);
      });
    });
  });
}
function sheetText(sh){
  return (sh.title||"") + sh.dateLabel + sh.grades.join("") + "학년자습()0123456789:~ " + sh.rows.map(r => r.time + r.cells.flat().map(c => (c.name||"")+(c.code||"")).join("")).join("");
}
async function ensureFont(fam, txt){
  const w = FONTS[fam] ? FONTS[fam].weight : 400;
  try { await document.fonts.load(`${w} 40px "${fam}"`, txt); } catch(e){}
}
let drawToken = 0;
async function drawPreviews(){
  const token = ++drawToken;
  const P = PAPERS[state.paper];
  const canvases = Array.from(main.querySelectorAll("canvas[data-room]"));
  const cache = {};
  const all = state.rooms.map(r => { cache[r.id] = buildSheets(r); return cache[r.id]; }).flat();
  await ensureFont(state.font, all.map(sheetText).join(""));
  if(token !== drawToken) return;
  canvases.forEach(cv => {
    const sh = (cache[cv.dataset.room] || [])[+cv.dataset.i]; if(!sh) return;
    const W = 1000, H = Math.round(W*P.h/P.w);
    cv.width = W; cv.height = H;
    drawSheet(cv.getContext("2d"), W, H, sh, state.font);
  });
}

/* ---------- PDF ---------- */
async function savePdf(rooms, filename){
  return runPdf("pdfMsg", async say => {
    const groups = rooms.map(r => ({r, sheets: buildSheets(r)})).filter(x => x.sheets.length);
    const sheets = groups.map(x => x.sheets).flat();
    if(!sheets.length){ say("출력할 시간표가 없어요. 출력 대상 교실과 시간표 입력을 확인하세요.", true); return false; }
    say("준비 중… 글꼴을 불러오고 있어요");
    await ensureFont(state.font, sheets.map(sheetText).join(""));
    const fontNote = webFontLoaded(state.font) ? "" : ` (‘${state.font}’ 웹 글꼴을 불러오지 못해 컴퓨터 기본 글꼴로 만들었어요)`;
    const P = PAPERS[state.paper];
    const dpi = 250, W = Math.round(P.w/25.4*dpi), H = Math.round(P.h/25.4*dpi);
    const doc = new window.jspdf.jsPDF({orientation:"landscape", unit:"mm", format:[P.h, P.w], compress:true});
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    for(let i = 0; i < sheets.length; i++){
      say(`생성 중… ${i+1} / ${sheets.length}장`); await tick();
      if(i) doc.addPage([P.h, P.w], "landscape");
      drawSheet(ctx, W, H, sheets[i], state.font);
      doc.addImage(cv.toDataURL("image/jpeg", 0.94), "JPEG", 0, 0, P.w, P.h, undefined, "FAST");
    }
    // 교실별 책갈피 (PDF 뷰어 왼쪽 목록에서 교실 구분)
    try {
      let page = 1;
      groups.forEach(({r, sheets: ss}) => {
        const parent = doc.outline.add(null, `${r.label || "교실"} (${r.grades[0]}·${r.grades[1]}학년)`, {pageNumber: page});
        ss.forEach((sh, i) => doc.outline.add(parent, sh.dateLabel, {pageNumber: page + i}));
        page += ss.length;
      });
    } catch(e){}
    const ok = await deliver(doc.output("blob"), filename, t => say(t + (t.startsWith("완료") ? fontNote : "")));
    if(ok){ state.printed = {sig: sigOf(state), at: new Date().toISOString()}; commit(false); renderNav(); }
    return ok;
  });
}
function pdfName(suffix){
  const ds = sortedDays();
  const d = ds.length ? parseDate(ds[0].date) : null;
  const ym = d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}` : "";
  const base = (state.examTitle || "").trim() || `시험시간표${ym?"_"+ym:""}`;
  return `${base}_${suffix}_${state.paper}.pdf`.replace(/[\\/:*?"<>|]/g,"");
}

/* ---------- 붙여넣기 파서 ---------- */
function parseLines(txt){
  return txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    let m = l.match(/^(.+?)\s*[\(（]\s*([^()（）]+?)\s*[\)）]\s*$/);
    if(m) return {name:m[1].trim(), code:m[2].trim()};
    if(/[\t,]/.test(l)){ const p = l.split(/[\t,]/).map(x => x.trim()).filter(Boolean); return {name:p[0], code:p[1]||""}; }
    m = l.match(/^(.+?)\s+(\d{1,4})$/);
    if(m) return {name:m[1].trim(), code:m[2]};
    return {name:l, code:""};
  }).filter(x => x.name);
}

/* =====================================================================
   시험 자리 배치 (시간표와 독립된 데이터: seat → localStorage exam-seat-state-v1, DB app/seats)
   ===================================================================== */
const TAGS = ["", "이동", "고정"];
const GRADES = ["1","2","3"];
const pad2 = n => String(n).padStart(2,"0");
const clampInt = (v, lo, hi, def) => { v = parseInt(v, 10); return isNaN(v) ? def : Math.min(hi, Math.max(lo, v)); };
const mkCells = n => Array.from({length:n}, () => ({off:false, tag:"", hold:false}));
// start = 시작 번호, count = 끝 번호 (예전 데이터의 count는 '1~count'의 끝 번호라 그대로 호환)
function newGroup(grade, cls, count, absent, start){ return {id:uid(), grade:String(grade), cls:+cls, count:+count, start:+(start || 1), absent:absent || []}; }
function newRoom(label, groups){
  return {id:uid(), label, type: groups.length > 1 ? "cross" : "single", groups, absentMode:"skip",
    cols:6, rows:6, pair:1, desk:"top", door:"r", cells:mkCells(36),
    mode:"alt", start:"left", assign:null, print:true};
}
function seatDefault(title){
  const r = newRoom("2-3교실", [newGroup(1,3,20,[7,15]), newGroup(2,3,18,[])]);
  return {v:1, examTitle: title || "", paper:"B4", rooms:[r], templates:[], active:r.id, example:true};
}
function fixCells(cells, n){
  const out = mkCells(n);
  if(Array.isArray(cells)) cells.slice(0, n).forEach((c, i) => { if(c){ out[i].off = !!c.off; out[i].tag = TAGS.includes(c.tag) ? c.tag : ""; out[i].hold = !!c.hold; } });
  return out;
}
const pick1 = (v, list, def) => list.includes(v) ? v : def;
function fixRoom(r){
  const o = Object.assign(newRoom("교실", []), r);
  o.id = o.id || uid(); o.label = typeof o.label === "string" ? o.label : "교실";
  o.cols = clampInt(o.cols,1,12,6); o.rows = clampInt(o.rows,1,12,6); o.pair = 1; // 책상 묶음은 항상 1개씩
  o.cells = fixCells(o.cells, o.cols*o.rows);
  o.groups = (Array.isArray(o.groups) ? o.groups : []).filter(g => g && typeof g === "object").map(g => ({
    id: g.id || uid(), grade: pick1(String(g.grade), GRADES, "1"), cls: clampInt(g.cls,1,30,1), count: clampInt(g.count,1,60,30), start: clampInt(g.start,1,60,1),
    absent: Array.isArray(g.absent) ? [...new Set(g.absent.map(Number).filter(n => n >= 1 && n <= 60))].sort((a,b) => a-b) : []}));
  o.groups.forEach(g => { if(g.start > g.count) g.start = 1; });
  o.type = pick1(o.type, ["single","cross"], "single");
  o.absentMode = pick1(o.absentMode, ["skip","mark"], "skip");
  o.desk = "top"; // 교탁은 항상 위 (교사용 상하 반전본은 출력 단계에서 따로 만듦)
  // 출입문은 한쪽 벽의 앞·뒤 두 곳 (예전 값 lf·lb → 왼쪽, rf·rb → 오른쪽)
  o.door = o.door === "none" ? "none" : String(o.door || "r")[0] === "l" ? "l" : "r";
  o.mode = pick1(o.mode, ["alt","grade","manual"], "alt");
  delete o.flow; // 번호 진행은 항상 세로(앞→뒤)
  o.start = pick1(o.start, ["left","right"], "left"); // 1번 시작: 왼쪽 앞(기본) 또는 오른쪽 앞
  if(!o.assign || typeof o.assign !== "object" || Array.isArray(o.assign)) o.assign = null;
  if(o.print === undefined) o.print = true;
  return o;
}
function normalizeSeat(d){
  const s = Object.assign({v:1, examTitle:"", paper:"B4", rooms:[], templates:[], active:null}, d && typeof d === "object" ? d : {});
  delete s._meta; // 저장소 동기화 정보는 업무 데이터에 섞지 않음
  if(!PAPERS[s.paper]) s.paper = "B4";
  if(typeof s.examTitle !== "string") s.examTitle = "";
  s.rooms = (Array.isArray(s.rooms) ? s.rooms : []).filter(r => r && typeof r === "object").map(fixRoom);
  s.templates = (Array.isArray(s.templates) ? s.templates : []).filter(t => t && t.cols && t.rows).map(t => {
    const x = fixRoom(t); return {id: t.id || uid(), name: String(t.name || "교실 구조"), cols:x.cols, rows:x.rows, pair:x.pair, desk:x.desk, door:x.door, cells: x.cells.map(c => ({off:c.off, tag:c.tag, hold:false}))};
  });
  if(!s.rooms.length) s.rooms = [newRoom("시험실 1", [newGroup(1,1,30,[])])];
  if(!s.rooms.some(r => r.id === s.active)) s.active = s.rooms[0].id;
  return s;
}
try { const raw = localStorage.getItem(LS_SEAT); if(raw) seat = normalizeSeat(JSON.parse(raw)); } catch(e){}
function ensureSeat(){ if(!seat){ seat = seatDefault((state.examTitle || "").trim()); commitSeat(false); } }
const AR = () => seat.rooms.find(r => r.id === seat.active) || seat.rooms[0];

/* ---------- 학생 번호 · 자동 배치 ---------- */
const effGroups = r => r.type === "single" ? r.groups.slice(0,1) : r.groups.slice(0,2); // 한 시험실은 최대 2개 학년
const gLabel = g => `${g.grade}-${g.cls}`;
const gStart = g => Math.min(g.start || 1, g.count);
// 결번은 지금 번호 범위(시작~끝) 안의 것만 적용 — 범위를 넓히면 예전 결번이 다시 살아나도록 저장값은 지우지 않음
const gAbs = g => g.absent.filter(n => n >= gStart(g) && n <= g.count);
const stuKey = (g, n) => `${g.grade}${pad2(g.cls)}${pad2(n)}`;   // 1학년 3반 1번 → 10301
function roster(r){
  const out = [], seen = new Set();
  effGroups(r).forEach((g, gi) => {
    const ab = new Set(g.absent);
    for(let n = gStart(g); n <= g.count; n++){
      const a = ab.has(n);
      if(a && r.absentMode === "skip") continue;
      const key = stuKey(g, n);
      if(seen.has(key)) continue; seen.add(key);
      out.push({key, gi, n, absent:a});
    }
  });
  return out;
}
const usable = (r, i) => !r.cells[i].off && !r.cells[i].hold;
// 좌석 순서: 시작 열(왼쪽 또는 오른쪽 끝)의 앞자리(교탁 쪽)부터 뒤로, 다음 열 앞자리로 이어짐 (화면·미리보기·PDF 공통)
// 학년 교차일 때도 각 학년은 자기 열들 안에서 같은 순서로 채워짐
function colOrder(r){ const a = [...Array(r.cols).keys()]; return r.start === "right" ? a.reverse() : a; }
function seatSeq(r){
  const seq = [], co = colOrder(r);
  co.forEach(x => { for(let y = 0; y < r.rows; y++){ const i = y*r.cols + x; if(usable(r,i)) seq.push(i); } });
  return seq;
}
function autoLayout(r, ros){
  const seq = seatSeq(r), map = {}, G = effGroups(r).length;
  if(r.mode === "alt" && G > 1){
    // 학년 교차: 열 단위로 응시 집단을 번갈아 배정 (1-3 | 2-3 | 1-3 | 2-3 …)
    const cols = colOrder(r).filter(x => seq.some(i => i % r.cols === x));
    const colG = {}; cols.forEach((x, k) => colG[x] = k % G);
    const free = new Set(seq), rest = [];
    for(let gi = 0; gi < G; gi++){
      const mine = seq.filter(i => colG[i % r.cols] === gi);
      ros.filter(s => s.gi === gi).forEach((s, k) => { if(k < mine.length){ map[mine[k]] = s.key; free.delete(mine[k]); } else rest.push(s); });
    }
    const fr = seq.filter(i => free.has(i));
    rest.forEach((s, k) => { if(k < fr.length) map[fr[k]] = s.key; });
  } else {
    ros.forEach((s, k) => { if(k < seq.length) map[seq[k]] = s.key; });   // 같은 학년 우선 (집단 순서대로)
  }
  return map;
}
function layout(r){
  const ros = roster(r), byKey = {}; ros.forEach(s => byKey[s.key] = s);
  let map = {};
  if(r.assign){
    const used = new Set();

function parseNums(txt, max){

/* ---------- 자리 배치도 그리기 (미리보기·PDF 공용) ---------- */
const SFH = `"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif`;
const SFB = `"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif`;
function makeText(ctx){
  return (str, x, y, maxW, size, o) => {
    o = o || {};
    const w = o.w || 900, fam = o.fam || SFH, minScale = o.min || 0.6;
    const setF = sz => { ctx.font = `${w} ${sz}px ${fam}`; };
    setF(size);
    let tw = ctx.measureText(str).width, sx = 1;
    if(maxW && tw > maxW){ sx = maxW/tw; if(sx < minScale){ size = size*sx/minScale; setF(size); tw = ctx.measureText(str).width; sx = Math.min(1, maxW/tw); } }
    const m = ctx.measureText("가0");
    const asc = m.actualBoundingBoxAscent || size*0.8, desc = m.actualBoundingBoxDescent || size*0.1;
    ctx.save(); ctx.fillStyle = o.color || "#000"; ctx.translate(x, y + (asc-desc)/2); ctx.scale(sx, 1);
    ctx.textAlign = o.align || "center"; ctx.textBaseline = "alphabetic"; ctx.fillText(str, 0, 0); ctx.restore();
    return tw*sx;
  };
}
// teacher=true: 교사용 — 교탁에서 학생들을 바라본 방향 (교탁 아래, 좌우도 함께 뒤집힘 = 180° 회전)
function drawSeatSheet(ctx, W, H, r, title, teacher){
  const U = W/1000, T = makeText(ctx), L = layout(r), info = roomInfo(r), gs = effGroups(r);
  const line = (ax,ay,bx,by) => { ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); };
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,H); ctx.strokeStyle = "#000"; ctx.fillStyle = "#000";
  const m = W*0.04;
  // 제목
  T(seatTitle(title), W/2, H*0.06, W - 2*m, 36*U);
  if(teacher) T("교사용 · 교탁에서 본 방향", W - m, H*0.06, W*0.2, 14*U, {w:700, fam:SFB, align:"right", color:"#555"});
  // 시험실 이름 + 응시 인원 · 결번
  const by0 = H*0.1, bh = H*0.074;
  const label = r.label || "교실";
  ctx.font = `900 ${30*U}px ${SFH}`;
  const lw = Math.min(W*0.3, ctx.measureText(label).width + 44*U);
  ctx.lineWidth = 2.6*U; ctx.strokeRect(m, by0, lw, bh);
  T(label, m + lw/2, by0 + bh/2, lw - 22*U, 30*U);
  // 범례 (오른쪽)
  const fills = ["#ffffff", "#e2e2e2", "#c4c4c4"];
  let lgW = 0;
  if(gs.length > 1){
    ctx.font = `700 ${16*U}px ${SFB}`;
    gs.forEach(g => lgW += ctx.measureText(gLabel(g)).width + 16*U + 8*U + 18*U);
    let x = W - m;
    for(let k = gs.length - 1; k >= 0; k--){
      const tw = T(gLabel(gs[k]), x, by0 + bh*0.27, 0, 16*U, {w:700, fam:SFB, align:"right"});
      x -= tw + 8*U + 16*U;
      ctx.fillStyle = fills[Math.min(k,2)]; ctx.fillRect(x, by0 + bh*0.27 - 8*U, 16*U, 16*U);
      ctx.lineWidth = 1.6*U; ctx.strokeRect(x, by0 + bh*0.27 - 8*U, 16*U, 16*U);
      x -= 18*U;
    }
    ctx.fillStyle = "#000";
  }
  const ix = m + lw + 24*U;
  T(`응시 인원   ${info.countText}`, ix, by0 + bh*0.27, W - m - ix - lgW - 10*U, 18*U, {w:700, fam:SFB, align:"left", min:0.7});
  T(`결번   ${info.absText}`, ix, by0 + bh*0.75, W - m - ix, 18*U, {w:700, fam:SFB, align:"left", min:0.7});
  // 교실 벽 + 출입문
  const fx0 = m, fx1 = W - m, fy0 = H*0.205, fy1 = H*0.955, top = !teacher;
  // 출입문: 한쪽 벽의 앞·뒤 두 곳
  const gaps = [];
  if(r.door !== "none"){
    const gl = H*0.1, side = teacher ? (r.door === "l" ? "r" : "l") : r.door;
    [fy0 + H*0.045, fy1 - H*0.045 - gl].forEach(y0 => gaps.push({side, y0, y1: y0 + gl, gl}));
  }
  ctx.lineWidth = 3.2*U; ctx.lineCap = "square";

    if(!gs2.length){ line(x,fy0,x,fy1); return; }
    let y = fy0; gs2.forEach(g => { line(x,y,x,g.y0); y = g.y1; }); line(x,y,x,fy1);

  gaps.forEach(gap => {

    ctx.lineWidth = 1.4*U; ctx.setLineDash([5*U, 4*U]); line(x, gap.y0, x, gap.y1); ctx.setLineDash([]);
    const lx = gap.side === "l" ? fx0 - m*0.48 : fx1 + m*0.48, cy = (gap.y0 + gap.y1)/2;

  // 교탁
  const dw = W*0.18, dh = H*0.06, dy = top ? fy0 + H*0.026 : fy1 - H*0.026 - dh;
  ctx.fillStyle = "#efefef"; ctx.fillRect(W/2 - dw/2, dy, dw, dh);
  ctx.lineWidth = 2.6*U; ctx.strokeRect(W/2 - dw/2, dy, dw, dh);

  const ct = colTags(r), hasCT = ct.some(Boolean), tagH = hasCT ? H*0.042 : 0;
  let ry0 = top ? dy + dh + H*0.03 : fy0 + H*0.03, ry1 = top ? fy1 - H*0.03 : dy - H*0.03;
  if(top) ry0 += tagH; else ry1 -= tagH;

  const gx0 = (rx0 + rx1 - totW)/2, gy0 = top ? ry0 : ry1 - totH;
  const X = c => { if(teacher) c = C - 1 - c; return gx0 + c*cw + Math.floor(c/P)*gw; }, Y = y => gy0 + (top ? y : R-1-y)*(ch + rg);
  if(hasCT){
    const ty = top ? gy0 - tagH/2 : gy0 + totH + tagH/2;
    ct.forEach((t, c) => { if(t) T(t, X(c) + cw/2, ty, cw*0.9, Math.min(19*U, tagH*0.62), {w:700, fam:SFB}); });
  }

  for(let y = 0; y < R; y++) for(let c = 0; c < C; c++){
    const i = y*C + c, cell = r.cells[i];
    if(cell.off) continue;
    const x = X(c), yy = Y(y), key = L.map[i], s = key ? L.byKey[key] : null;
    ctx.fillStyle = s && !cell.hold ? fills[Math.min(s.gi,2)] : "#fff"; ctx.fillRect(x, yy, cw, ch);

    const ncy = yy + ch*(tg ? 0.57 : 0.5);

async function deliver(blob, filename, say){

  document.body.appendChild(a); a.click(); a.remove();

/* ---------- PDF 생성 공통: 준비 중 → 생성 중 → 완료/실패, 생성 중 중복 클릭 방지 ---------- */
let pdfBusy = false;
const webFontLoaded = fam => { try { return [...document.fonts].some(f => f.family.replace(/["']/g,"") === fam && f.status === "loaded"); } catch(e){ return true; } };
async function runPdf(msgId, work){
  const msg = document.getElementById(msgId);
  const say = (t, err) => { const m = document.getElementById(msgId) || msg; if(m) m.innerHTML = t ? `<div class="msg ${err?"err":""}" role="status">${esc(t)}</div>` : ""; };
  if(pdfBusy){ say("이미 PDF를 만들고 있어요. 끝날 때까지 기다려 주세요."); return; }
  if(!window.jspdf){ say("PDF 도구(jsPDF)를 불러오지 못해 PDF를 만들 수 없어요. 인터넷 연결을 확인하고 페이지를 새로고침해 주세요. 미리보기는 그대로 볼 수 있어요.", true); return; }
  pdfBusy = true;
  const btns = [...document.querySelectorAll('[data-act^="pdf"],[data-sact^="spdf"]')], prev = btns.map(b => b.disabled);
  btns.forEach(b => { b.disabled = true; b.setAttribute("aria-busy","true"); });
  try { return await work(say); }
  catch(e){
    console.error("PDF 생성 실패:", e && e.name);   // 학생·시험 데이터는 로그에 남기지 않음
    say(`실패 — PDF를 만들지 못했어요 (${e && e.message ? e.message : "알 수 없는 오류"}). 다시 눌러 주세요. 계속 실패하면 교실을 나눠서 저장하거나 더 작은 용지로 바꿔 보세요.`, true);
    return false;
  } finally {
    pdfBusy = false;
    btns.forEach((b, i) => { b.disabled = prev[i]; b.removeAttribute("aria-busy"); });
  }
}
const tick = () => new Promise(r => setTimeout(r, 0));
async function saveSeatPdf(rooms, filename){
  return runPdf("spdfMsg", async say => {
    if(!rooms.length){ say("출력할 시험실이 없어요. 출력 대상에서 시험실을 고르세요.", true); return false; }
    say(`준비 중… 글꼴을 불러오고 있어요`);
    await ensureSeatFonts(seatFontText());
    const fontNote = webFontLoaded("Noto Sans KR") ? "" : " (웹 글꼴을 불러오지 못해 컴퓨터 기본 글꼴로 만들었어요)";
    const P = PAPERS[seat.paper];
    const dpi = 230, W = Math.round(P.w/25.4*dpi), H = Math.round(P.h/25.4*dpi);
    const doc = new window.jspdf.jsPDF({orientation:"landscape", unit:"mm", format:[P.h, P.w], compress:true});
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    for(let i = 0; i < rooms.length; i++){
      say(`생성 중… ${i+1} / ${rooms.length}장`); await tick();
      if(i) doc.addPage([P.h, P.w], "landscape");
      drawSeatSheet(ctx, W, H, rooms[i], seat.examTitle, !!seat.teacher);
      doc.addImage(cv.toDataURL("image/jpeg", 0.93), "JPEG", 0, 0, P.w, P.h, undefined, "FAST");
    }
    try { rooms.forEach((r, i) => doc.outline.add(null, `${r.label || "교실"} (${effGroups(r).map(gLabel).join("+")})`, {pageNumber: i+1})); } catch(e){}
    window.__lastSeatPdf = {filename, pages: rooms.length};
    const ok = await deliver(doc.output("blob"), filename, t => say(t + (t.startsWith("완료") ? fontNote : "")));
    if(ok){ seat.printed = {sig: sigOf(seat), at: new Date().toISOString()}; commitSeat(false); renderNav(); }
    return ok;
  });
}

function armBtn(b, key, label, txt, ms){
  if(armed === key) { armed = null; return true; }

  setTimeout(() => { if(armed === key){ armed = null; b.classList.remove("armed"); b.textContent = label; } }, ms || 3200);

}
function setGrid(r, c, rr){
  r.cols = clampInt(c,1,12,r.cols); r.rows = clampInt(rr,1,12,r.rows);
  r.cells = mkCells(r.cols*r.rows); r.assign = null; selSeat = null;

// 직접 고친 배치가 있는 교실에서 배치를 다시 계산하게 되는 변경은 먼저 확인받음 (그 교실만 해당)
let seatPending = null;
const hasManual = r => !!(r.assign && Object.keys(r.assign).length);
// 다시 배치했을 때의 결과를 미리 계산 (실제 데이터는 바로 원래대로 되돌림)
function previewReset(r, run){
  const snap = JSON.stringify(r), keep = {selSeat, selStu, tplMsg};
  const before = Object.assign({}, layout(r).map), manual = Object.keys(r.assign || {}).length;
  let after = {}, ros = 0, seats = 0;
  try { run(); r.assign = null; const L = layout(r); after = L.map; ros = L.ros.length; seats = L.seq.length; }
  finally { Object.keys(r).forEach(k => delete r[k]); Object.assign(r, JSON.parse(snap)); selSeat = keep.selSeat; selStu = keep.selStu; tplMsg = keep.tplMsg; }
  const where = m => { const o = {}; Object.keys(m).forEach(i => o[m[i]] = i); return o; };
  const wb = where(before), wa = where(after);
  const moved = Object.keys(wa).filter(k => wb[k] !== wa[k]).length;
  return {ros, seats, manual, moved};
}
function guardReset(r, label, run){
  if(hasManual(r)){ seatPending = {rid: r.id, label, run, info: previewReset(r, run)}; render(); const c = document.getElementById("seatConfirm"); if(c) c.scrollIntoView({block:"nearest"}); return; }
  pushUndo("seat", label); run(); commitSeat();
}

function onSeatCell(i){
  const r = AR(), cell = r.cells[i];
  seatMsg = "";
  if(brush === "swap"){
    if(cell.off || cell.hold){ selSeat = null; seatMsg = "‘사용 안 함’이나 ‘결번’ 좌석에는 학생을 앉힐 수 없어요. 먼저 ‘좌석 누르면’에서 같은 버튼으로 해제하세요."; return render(); }
    if(selStu){
      pushUndo("seat", `${selStu} 자리 지정`);
      materialize(r);
      Object.keys(r.assign).forEach(k => { if(r.assign[k] === selStu) delete r.assign[k]; });
      r.assign[i] = selStu; selStu = null; return commitSeat();
    }
    if(selSeat === null){ selSeat = i; return render(); }
    if(selSeat === i){ selSeat = null; return render(); }
    pushUndo("seat", "자리 바꾸기");
    materialize(r);
    const a = r.assign[selSeat], b = r.assign[i];
    delete r.assign[selSeat]; delete r.assign[i];
    if(b) r.assign[selSeat] = b; if(a) r.assign[i] = a;
    selSeat = null; return commitSeat();
  }
  selSeat = null;
  const lab = {"이동":"이동 표시","고정":"고정 표시",clear:"표시 지우기",hold:"결번 자리 지정",off:"사용 안 함 지정"}[brush];
  if(cell.off && brush !== "off" && brush !== "hold") return;
  pushUndo("seat", lab);
  if(brush === "이동" || brush === "고정"){ cell.tag = cell.tag === brush ? "" : brush; return commitSeat(); }
  if(brush === "clear"){ cell.tag = ""; return commitSeat(); }
  // 결번·사용 안 함으로 바꾼 자리의 학생은 '자리 없는 학생'으로 옮겨지고, 다른 자리 배정은 그대로 유지
  if(brush === "hold"){ cell.hold = !cell.hold; if(cell.hold){ cell.off = false; if(r.assign) delete r.assign[i]; } return commitSeat(); }

    if(hasManual(r) && !armBtn(b, "clearAll", b.textContent, `‘${r.label || "교실"}’ 배정을 모두 비워요 · 한 번 더`)) return;

  }

    selStu = null; return commitSeat();
  }
  if(a === "cleanAssign"){
    pushUndo("seat", "명단에 없는 배정 정리");
    const ros = new Set(roster(r).map(s => s.key)), seen = new Set();
    Object.keys(r.assign || {}).forEach(k => { const key = r.assign[k]; if(!ros.has(key) || seen.has(key) || !usable(r, +k)) delete r.assign[k]; else seen.add(key); });
    return commitSeat();
  }
  if(a === "unseat"){ if(selSeat === null) return; pushUndo("seat", "자리에서 빼기"); materialize(r); delete r.assign[selSeat]; selSeat = null; return commitSeat(); }
  if(a === "cancelSel"){ selSeat = null; return render(); }
  if(a === "pickStu"){ selStu = selStu === b.dataset.key ? null : b.dataset.key; selSeat = null; return render(); }
  if(a === "spdfRoom" || a === "spdfAll" || a === "spdfSel"){
    const rs = a === "spdfRoom" ? seat.rooms.filter(y => y.id === b.dataset.rid) : a === "spdfAll" ? seat.rooms : seat.rooms.filter(x => x.print !== false);
    const ne = rs.reduce((n, x) => n + seatCheck(x).filter(c => c.lv === "err").length, 0);

    const name = a === "spdfRoom" ? (rs[0] && rs[0].label || "교실") : (rs.length === seat.rooms.length ? "전체" : rs.map(x => x.label || "교실").join("+"));
    saveSeatPdf(rs, seatPdfName(name)); return;
  }
}
function onSeatChange(t){
  const r = AR();
  if(t.dataset.brush){ brush = t.value; selSeat = null; selStu = null; seatMsg = ""; return render(); }
  if(t.dataset.gf){
    const g = r.groups.find(x => x.id === t.dataset.gid); if(!g) return;
    const f = t.dataset.gf;
    pushUndo("seat", `${gLabel(g)} ${({grade:"학년",cls:"반",start:"시작 번호",count:"끝 번호",takers:"응시자 수",absent:"결번"})[f]} 변경`); seat.example = false;
    if(f === "grade" || f === "cls"){
      // 학년·반을 고쳐도 직접 고친 자리는 그대로 두고 번호만 바꿈 (10301 → 20301)
      const oldP = `${g.grade}${pad2(g.cls)}`;
      if(f === "grade") g.grade = t.value; else g.cls = clampInt(t.value,1,30,g.cls);
      const newP = `${g.grade}${pad2(g.cls)}`;
      if(r.assign && oldP !== newP) Object.keys(r.assign).forEach(k => { const v = r.assign[k]; if(v.length === 5 && v.startsWith(oldP)) r.assign[k] = newP + v.slice(3); });
    }
    else if(f === "count" || f === "start"){
      // 시작·끝 번호는 각각 따로 고침. 학생 번호(10301 등)는 번호 자체로 정해지므로 기존 배정은 그대로 유지되고,
      // 범위 밖으로 나간 학생만 배치도에서 빠짐 (범위를 다시 넓히면 원래 자리로 돌아옴)
      const v = clampInt(t.value, 1, 60, f === "count" ? g.count : gStart(g));
      if(f === "count"){ g.count = v; if(g.start > v){ g.start = v; seatMsg = `${gLabel(g)} 끝 번호가 시작 번호보다 작아서 시작 번호를 ${v}번으로 맞췄어요.`; } else seatMsg = ""; }
      else { if(v > g.count){ g.start = g.count; seatMsg = `${gLabel(g)} 시작 번호는 끝 번호(${g.count}번)보다 클 수 없어서 ${g.count}번으로 맞췄어요.`; } else { g.start = v; seatMsg = ""; } }
    }
    else if(f === "takers"){
      // 응시자 수를 고치면 시작 번호는 그대로 두고, 결번을 건너뛰며 끝 번호를 맞춤
      const want = clampInt(t.value, 1, 60, 1), st = gStart(g), ab = new Set(g.absent);
      let end = st - 1, n = 0;
      while(n < want && end < 60){ end++; if(!ab.has(end)) n++; }
      g.count = Math.max(end, st);
      seatMsg = n < want ? `${gLabel(g)}는 60번까지라 응시자를 ${n}명까지만 맞출 수 있어요.` : "";
    }
    else if(f === "absent"){
      const nums = parseNums(t.value, 60), st = gStart(g), out = nums.filter(n => n < st || n > g.count);
      g.absent = nums.filter(n => n >= st && n <= g.count);
      seatMsg = out.length ? `${gLabel(g)}의 결번 ${out.join(", ")}번은 번호 범위(${st}~${g.count}번) 밖이라 뺐어요.` : "";
    }
    return commitSeat();
  }
  if(t.dataset.sf){
    const f = t.dataset.sf; let v = t.value;
    if(f === "label"){ r.label = v; return commitSeat(); }
    if(f === "pair") v = +v;
    if(f === "type"){
      return guardReset(r, v === "cross" ? "여러 학년 교차로 바꾸기" : "한 학년만으로 바꾸기", () => {
        r.type = v;
        if(v === "cross" && r.groups.length < 2){ const g0 = r.groups[0]; r.groups.push(newGroup(g0 && g0.grade === "1" ? "2" : "1", g0 ? g0.cls : 1, g0 ? g0.count : 30, [], g0 ? gStart(g0) : 1)); }
        if(!r.groups.length) r.groups.push(newGroup(1,1,30,[]));
        r.assign = null;
      });
    }
    if(f === "mode" || f === "start"){
      const lab = f === "start" ? `1번 시작 ‘${v === "right" ? "오른쪽 앞" : "왼쪽 앞"}’` : `배치 방식 ‘${({alt:"학년 교차",grade:"같은 학년 우선",manual:"직접 배치"})[v]}’`;
      return guardReset(r, lab, () => { r[f] = v; r.assign = null; selSeat = null; selStu = null; });
    }
    pushUndo("seat", "교실 구조 설정 변경");
    r[f] = v;
    return commitSeat();
  }
  if(t.dataset.sprint){ const x = seat.rooms.find(y => y.id === t.dataset.sprint); if(x){ x.print = t.checked; commitSeat(); } return; }
  if(t.dataset.sset === "teacher"){ seat.teacher = t.value === "1"; return commitSeat(); }
  if(t.dataset.sset){ seat[t.dataset.sset] = t.value; return commitSeat(); }
  if(t.dataset.ssetText){ seat[t.dataset.ssetText] = t.value; return commitSeat(); }
}

/* ---------- 자리 배치 점검 ---------- */
function seatCheck(r){
  const items = [], E = (msg, go) => items.push({lv:"err", msg, go}), W = (msg, go) => items.push({lv:"warn", msg, go}), I = (msg, go) => items.push({lv:"info", msg, go});
  const L = layout(r), gs = effGroups(r), rid = r.id;
  const nm = `‘${r.label || "교실"}’`;
  if(!gs.length) E(`${nm}에 응시 집단이 없어요.`, {tab:"room", rid});
  // 응시 대상 = 배정 완료 + 미배정 (학생 고유 번호 기준, 중복은 따로 셈)
  { const seated = new Set(Object.values(L.map)); const tgt = L.ros.length, done = L.ros.filter(s => seated.has(s.key)).length;
    I(`${nm} 배치 현황: 응시 대상 ${tgt}명 = 배정 ${done}명 + 미배정 ${tgt - done}명 · 사용할 수 있는 좌석 ${L.seq.length}석 (사용 안 함·결번 자리 제외)`, null); }
  if(r.assign){
    const bad = Object.keys(r.assign).filter(k => r.cells[+k] && !usable(r, +k));
    if(bad.length) W(`${nm}의 ‘사용 안 함’·‘결번’ 자리 ${bad.length}곳에 예전 배정 기록이 남아 있어요. 출력에는 나오지 않지만 정리해 두는 게 좋아요.`, {tab:"place", rid, i: +bad[0]});
    const oddKey = [...new Set(Object.values(r.assign))].filter(k => !/^\d{5}$/.test(String(k)));
    if(oddKey.length) E(`${nm}에 학생 번호 형식이 아닌 값(${oddKey.slice(0,3).join(", ")})이 배정돼 있어요. 아래 ‘잘못된 배정 정리’를 누르세요.`, {tab:"place", rid});
  }
  const seenG = {};
  gs.forEach(g => { const k = gLabel(g); if(seenG[k]) E(`${nm}에 ${k} 응시 집단이 두 번 들어 있어요. 하나를 지우거나 반을 고치세요.`, {tab:"room", rid, id:"gc-"+g.id}); seenG[k] = 1; });
  if(r.type === "cross" && gs.length > 1 && new Set(gs.map(g => g.grade)).size === 1) W(`${nm}은 ‘여러 학년 교차’인데 응시 집단이 모두 ${gs[0].grade}학년이에요.`, {tab:"room", rid});
  if(r.type === "single" && r.groups.length > 1) I(`${nm}은 ‘한 학년만’이라 첫 번째 응시 집단(${gLabel(r.groups[0])})만 써요. 나머지 집단은 숨겨져 있어요.`, {tab:"room", rid});
  // 같은 학생이 여러 자리에 배정됐는지 (저장된 직접 배치 기준)
  if(r.assign){
    const where = {}; Object.keys(r.assign).forEach(k => { if(usable(r, +k)) (where[r.assign[k]] = where[r.assign[k]] || []).push(+k); });
    Object.entries(where).forEach(([key, list]) => { if(list.length > 1) E(`${key}가 ${list.length}개 자리에 배정돼 있어요. 한 자리에만 남기세요.`, {tab:"place", rid, i:list[1]}); });
    const ros = new Set(L.ros.map(s => s.key)), stray = [...new Set(Object.keys(r.assign).filter(k => usable(r, +k)).map(k => r.assign[k]).filter(key => !ros.has(key)))];
    if(stray.length){
      const absentish = stray.filter(key => gs.some(g => key.startsWith(`${g.grade}${pad2(g.cls)}`)));
      W(`명단에 없는 번호 ${stray.slice(0,6).join(", ")}${stray.length > 6 ? " …" : ""}가 배정돼 있었어요${absentish.length ? " (결번이거나 번호 범위 밖으로 나간 학생)" : " (학년·반이 지금 설정과 달라요)"}. 출력에서는 빠지고 그 자리는 비어요.`, {tab:"place", rid});
    }
  }
  if(L.ros.length > L.seq.length) E(`${nm} 좌석이 ${L.ros.length - L.seq.length}석 모자라요 (응시 ${L.ros.length}명 · 좌석 ${L.seq.length}석).`, {tab:"room", rid, id:"gridCols"});
  if(L.pool.length) E(`${nm}에 자리가 없는 학생 ${L.pool.length}명: ${L.pool.slice(0,8).map(s => s.key).join(", ")}${L.pool.length > 8 ? " …" : ""}`, {tab:"place", rid, id:"poolPanel"});
  const markAbs = L.ros.filter(s => s.absent && Object.values(L.map).includes(s.key));
  if(markAbs.length) I(`결번 ${markAbs.length}명은 자리에 ‘결번’으로 표시돼요 (결번 처리: 자리 남기기).`, {tab:"room", rid});
  if(r.cols > 8 || r.rows > 8) I(`좌석이 ${r.cols}열×${r.rows}행이라 번호 글씨가 작아져요. 미리보기로 확인하고, 필요하면 A3로 출력하세요.`, {tab:"print"});
  const empty = L.seq.filter(i => !L.map[i]).length;
  if(empty && !L.pool.length) I(`빈 좌석 ${empty}석 — 학생이 배정되지 않은 자리예요. 일부러 비워 둔 거라면 괜찮아요.`, {tab:"place", rid});
  // 같은 학생이 다른 시험실에도 있는지
  seat.rooms.forEach(o => {
    if(o.id === r.id) return;
    effGroups(o).forEach(og => gs.forEach(g => {
      if(og.grade !== g.grade || og.cls !== g.cls) return;
      const mine = new Set(roster(r).filter(s => !s.absent).map(s => s.key)), both = roster(o).filter(s => !s.absent && mine.has(s.key));
      if(both.length) W(`${gLabel(g)} 학생 ${both.length}명이 ${nm}과 ‘${o.label || "교실"}’에 모두 들어 있어요. 같은 시험이라면 한 시험실에만 두세요.`, {tab:"room", rid});
    }));
  });
  return items;
}

  }
